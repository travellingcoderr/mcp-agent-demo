name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t drug-safety-agent .
      - name: Container boots and answers /healthz
        run: |
          docker run -d -p 8080:8080 --name app drug-safety-agent
          for i in $(seq 1 20); do curl -sf localhost:8080/healthz && exit 0; sleep 2; done
          docker logs app; exit 1
